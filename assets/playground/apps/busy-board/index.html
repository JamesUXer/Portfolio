<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Busy Board v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap">
<style>
/* Layout: one hand-drawn board, fitted to the screen, black marker on white paper.
   Colour only ever appears as feedback (weather, lighting, power, disco). Single deliberate light look. */
:root{
  --paper:#ffffff;
  --ink:#141414;
  --surround:#f3f3f1;
  --night:#08080b;
  --hand:'Gochi Hand','Comic Sans MS','Chalkboard SE',cursive;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{
  background:var(--surround);color:var(--ink);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  transition:background .4s;
}
html[data-light=off] body{background:var(--night)}
html[data-power=white] body{background:#dde2e8}
html[data-light=off][data-power=white] body{background:#16181c}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#board,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}

/* everything is drawn; only .hit shapes take touches */
#board *{pointer-events:none}
#board .hit{pointer-events:all;fill:transparent;stroke:none;cursor:pointer}
#board .hitStroke{pointer-events:stroke;stroke:transparent;cursor:grab}
.k{stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.nos{stroke:none}
.txt{font-family:var(--hand);fill:var(--ink)}
html[data-power=white] .k{stroke:#2c2c2c}

/* weather-dependent pieces */
.w-sun,.w-rain,.w-snow{opacity:0;transition:opacity .9s}
html[data-weather=sun] .w-sun,html[data-weather=rain] .w-rain,html[data-weather=snow] .w-snow{opacity:1}
.pw-colour,.pw-white{opacity:0;transition:opacity .6s}
html[data-power=colour] .pw-colour,html[data-power=white] .pw-white{opacity:1}
.dark-only{opacity:0;transition:opacity .4s}
html[data-light=off] .dark-only{opacity:1}

#dark{opacity:0;transition:opacity .35s}
html[data-light=off] #dark{opacity:.94}
html[data-light=off][data-power=white] #dark{opacity:.74}

/* small motions */
.fb{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wb .icon{transform-box:fill-box;transform-origin:center}
.wb.act .icon.sunI{animation:spin 6s linear infinite}
.wb.act .icon.rainI{animation:drizzle .5s linear infinite}
.wb.act .icon.snowI{animation:bobble 1.6s ease-in-out infinite alternate}
@keyframes drizzle{0%{transform:translateY(-2px)}100%{transform:translateY(3px)}}
@keyframes bobble{0%{transform:translate(-3px,0)}100%{transform:translate(3px,-2px)}}
.wb .wbfill{opacity:0;transition:opacity .2s}
.wb.act .wbfill{opacity:1}
.wb .press{transition:transform .08s}
.wb.down .press{transform:translateY(3px)}
html[data-power=colour] #wb-sun .ring{stroke:#e9a800}
html[data-power=colour] #wb-rain .ring{stroke:#2f7de1}
html[data-power=colour] #wb-snow .ring{stroke:#62b8d9}

.fall{animation:fall .8s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.slowfall{animation:slowfall 3s linear infinite}
@keyframes slowfall{0%{transform:translate(0,-8px)}50%{transform:translate(3px,8px)}100%{transform:translate(0,24px);opacity:0}}
.streak{animation:streak 2.2s ease-in infinite}
@keyframes streak{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(60px);opacity:0}}

.hopper{transform-box:fill-box;transform-origin:50% 100%}
html.hopping .hopper{animation:hop .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes hop{0%{transform:none}30%{transform:translateY(-16px) scale(.96,1.05)}62%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}

#pgFig{transform-box:fill-box;transform-origin:50% 100%}
#pgFig.phop{animation:phop .75s cubic-bezier(.3,1.4,.5,1)}
@keyframes phop{0%{transform:none}35%{transform:translateY(-58px) rotate(-8deg)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
#pgFig.shake{animation:shake .12s linear 5}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
#pgFig.shiver{animation:shiver .06s linear 14}
@keyframes shiver{0%,100%{transform:translateX(0)}50%{transform:translateX(2.5px)}}
html[data-weather=snow] #pgShiver{animation:shiver .09s linear infinite}

#lbInner{transform-box:fill-box;transform-origin:50% 50%}
#lbInner.lbhop{animation:lbhop .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes lbhop{0%{transform:none}40%{transform:translateY(-50px) rotate(200deg)}80%{transform:translateY(0) rotate(360deg)}100%{transform:none}}

#girBob{transform-box:fill-box;transform-origin:50% 100%}
html[data-power=colour] #girBob{animation:bob .42s ease-in-out infinite alternate}
@keyframes bob{0%{transform:translateY(0) rotate(-1.5deg)}100%{transform:translateY(-4px) rotate(1.5deg)}}

#curtainWrap{transform-box:fill-box;transform-origin:50% 0}
html[data-weather=snow] #curtainWrap{animation:sway 1.8s ease-in-out infinite alternate}
#curtainWrap.wiggle{animation:wig .22s ease-in-out infinite alternate}
@keyframes sway{0%{transform:skewX(-2deg)}100%{transform:skewX(2deg)}}
@keyframes wig{0%{transform:skewX(-5deg)}100%{transform:skewX(5deg)}}

.blob .squish{transform-box:fill-box;transform-origin:center;transition:transform .08s}
.blob.down .squish{transform:scale(.92)}
.blob .bfill{fill:transparent;transition:fill .5s}
.blob.down .bfill{fill:rgba(0,0,0,.08)}
html[data-power=colour] #blob-blue .bfill{fill:rgba(80,150,255,.55)}
html[data-power=colour] #blob-red .bfill{fill:rgba(255,80,80,.55)}
html[data-power=colour] #blob-green .bfill{fill:rgba(70,200,100,.55)}
.shell{transition:fill .5s}
html[data-power=colour] .shell{fill:#ff4a3a}

.splatIn{transform-box:fill-box;transform-origin:center;animation:splatIn .22s cubic-bezier(.2,1.6,.4,1) both}
@keyframes splatIn{0%{transform:scale(.2)}100%{transform:scale(1)}}
.pk{transform-box:fill-box;transform-origin:center}
.pk.poke{animation:poke .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes poke{0%{transform:none}35%{transform:scale(1.4) rotate(-8deg)}70%{transform:scale(.92) rotate(5deg)}100%{transform:none}}
.glow{opacity:0;transition:opacity .35s}
.glow.on{opacity:.5}
#resetFade{transition:opacity 1.3s ease-in}
.rz-haz,.rz-cap,.rz-tri,.rz-txt,.rz-shine{transition:fill .15s,stroke .15s}
html.resetting .rz-haz,#resetBtn.down .rz-haz{fill:url(#hazard)}
html.resetting .rz-cap,#resetBtn.down .rz-cap{fill:#ff2a1f}
html.resetting .rz-tri,#resetBtn.down .rz-tri{fill:#ffd23f}
html.resetting .rz-txt,#resetBtn.down .rz-txt{fill:#d4140b}
html.resetting .rz-shine,#resetBtn.down .rz-shine{stroke:#fff}
#resetFade.back{transition:opacity .7s ease-out}
#resetBtn .cap{transform-box:fill-box;transform-origin:center;transition:transform .1s}
#resetBtn.down .cap{transform:scale(.88)}
#L_alarm{opacity:0}
html.resetting #L_alarm{animation:alarm .3s steps(1) infinite}
@keyframes alarm{0%{opacity:1}50%{opacity:0}}
html.resetting #fx{opacity:0;transition:opacity 1.2s}
#owlRays{opacity:0;transition:opacity .25s}
#owlRays.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  .spin,.fall,.slowfall,.streak,html[data-power=colour] #girBob{animation:none}
}
</style>

<div id="stage">
<svg id="board" viewBox="30 20 1040 1170" preserveAspectRatio="xMidYMid meet" aria-label="Busy board">
  <defs>
    <clipPath id="boardClip"><polygon points="52,176 910,127 976,1076 50,1160"/></clipPath>
    <clipPath id="pgClip"><rect x="98" y="208" width="134" height="109"/></clipPath>
    <clipPath id="girClip"><rect x="465" y="435" width="162" height="292"/></clipPath>
    <clipPath id="winClip"><rect x="183" y="671" width="140" height="138"/></clipPath>
    <clipPath id="winClip2"><rect x="183" y="671" width="140" height="138"/></clipPath>
    <clipPath id="drClip"><rect id="drClipRect" x="196" y="830" width="121" height="0"/></clipPath>
    <clipPath id="stageClip"><rect x="88" y="976" width="96" height="134"/></clipPath>
    <clipPath id="mirClip"><ellipse cx="858" cy="1000" rx="83" ry="46"/></clipPath>
    <clipPath id="flapUnder"><rect x="263" y="1013" width="86" height="68"/></clipPath>
    <mask id="fogMask" maskUnits="userSpaceOnUse" x="760" y="940" width="200" height="120">
      <rect x="760" y="940" width="200" height="120" fill="#fff"/>
      <g id="wipes"></g>
    </mask>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <mask id="darkMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1100" height="1200">
      <rect x="0" y="0" width="1100" height="1200" fill="#fff"/>
      <rect id="discoHole" x="462" y="430" width="170" height="302" rx="30" fill="#000" filter="url(#blur10)" opacity="0"/>
    </mask>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="9" height="9" fill="#fff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#141414" stroke-width="2.4"/>
    </pattern>
    <linearGradient id="rainbowStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fa3"/><stop offset=".33" stop-color="#ffd23f"/>
      <stop offset=".66" stop-color="#3fd0ff"/><stop offset="1" stop-color="#7dff6a"/>
    </linearGradient>
    <radialGradient id="rg0"><stop offset="0" stop-color="#ff5fb0" stop-opacity=".9"/><stop offset="1" stop-color="#ff5fb0" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg1"><stop offset="0" stop-color="#ffd84a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg2"><stop offset="0" stop-color="#3fc8ff" stop-opacity=".9"/><stop offset="1" stop-color="#3fc8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg3"><stop offset="0" stop-color="#72f07a" stop-opacity=".9"/><stop offset="1" stop-color="#72f07a" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="L_bg"></g>
  <g id="L_sky"></g>
  <g id="L_glow"></g>
  <g id="L_lines"></g>
  <g id="L_obj"></g>
  <g id="L_paint" clip-path="url(#boardClip)"></g>
  <g id="L_snow" class="w-snow"></g>
  <g id="L_balloon"></g>
  <g id="L_reset"></g>
  <g id="L_hits"></g>
  <g id="L_fall"></g>
  <g id="L_cable"></g>
  <g id="L_lb"></g>
  <g id="dark" mask="url(#darkMask)"><rect x="0" y="0" width="1100" height="1200" fill="#08080b"/></g>
  <g id="L_top"></g>
  <rect id="resetFade" x="0" y="0" width="1100" height="1200" fill="#fff" opacity="0"/>
  <g id="L_alarm"></g>
</svg>
<canvas id="fx"></canvas>
</div>

<style>
#stage{top:var(--board-centre,50%)}
#board-controls{position:fixed;z-index:5;left:8px;right:8px;bottom:8px;background:#fff;color:#141414;border:1px solid #777;font:14px/1.5 Arial,sans-serif;padding:0 10px}
#board-controls,#board-controls *,#board-options,#board-options *{box-sizing:border-box}
#board-controls summary{min-height:44px;display:list-item;padding:12px 0;cursor:pointer;width:max-content;max-width:calc(100% - 218px)}
#board-options{position:fixed;z-index:6;right:15px;bottom:9px;display:flex;gap:6px;font:12px Arial,sans-serif}
#board-options button,#board-controls button{min-height:44px;border:1px solid #777;background:white;color:#141414;padding:7px 10px;font:inherit;cursor:pointer}
#board-options button{border:0;padding:6px}
#board-controls button[aria-pressed=true]{background:#222;color:white}
#board-controls fieldset{border:0;padding:0;margin:0 0 10px;display:flex;gap:8px;flex-wrap:wrap}
#board-controls legend{font-weight:bold;margin-bottom:6px}
.board-control-body{padding:8px 0 12px;max-height:40vh;overflow:auto;touch-action:pan-y}
.board-control-body>button,.board-control-body>label{margin-right:12px}.board-control-body>label{display:inline-block;margin-top:8px}
#board-lighting{width:140px;min-height:44px;vertical-align:middle;accent-color:#222}
.board-control-body p{font-size:12px;margin:8px 0 0;max-width:70ch}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #563493;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
html[data-board-paused=true] #board *,html[data-board-paused=true] #fx *{animation:none!important;transition:none!important}
@media(max-width:420px){#board-controls{font-size:12px}#board-options{font-size:11px;gap:0}#board-controls summary{max-width:calc(100% - 198px)}#board-options button{padding-inline:5px}}
</style>
<details id="board-controls"><summary>Board controls</summary><div class="board-control-body"><fieldset><legend>Weather</legend><button type="button" data-weather-control="sun" aria-pressed="false">Sun</button><button type="button" data-weather-control="rain" aria-pressed="false">Rain</button><button type="button" data-weather-control="snow" aria-pressed="false">Snow</button></fieldset><button type="button" id="board-light">Turn lights off</button><label for="board-lighting">Background lighting</label><input id="board-lighting" type="range" min="0" max="100" value="0"><button type="button" id="board-reset">Reset the board</button><p>Keyboard weather and lighting work while movement is paused. Resume movement to explore animated objects. Other objects use direct touch or pointer gestures.</p></div></details>
<div id="board-options"><button id="board-pause" type="button" aria-pressed="false">Pause movement</button><button id="board-mute" type="button" aria-pressed="false">Mute sound</button></div><p id="board-status" class="sr-only" role="status" aria-live="polite"></p>
<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg = $('board'), stage = $('stage'), cv = $('fx'), ctx = cv.getContext('2d');
const html = document.documentElement;
const VB = { x: 30, y: 20, w: 1040, h: 1170 };

/* ------------------------------------------------------------------ */
/* shared state                                                        */
/* ------------------------------------------------------------------ */
const state = {
  weather: null,          // null | 'sun' | 'rain' | 'snow'
  lightOn: true,
  powerMode: 'none',      // 'none' | 'colour' | 'white'
  backgroundLighting: 0   // 0..1 slider position
};
function applyState() {
  html.dataset.weather = state.weather || 'none';
  html.dataset.light = state.lightOn ? 'on' : 'off';
  html.dataset.power = state.powerMode;
  updateTint();
  if (state.powerMode === 'colour') musicStart(); else musicStop();
  syncAccessibleControls();
}

/* friendly disco loop for the giraffe: C – Am – F – G, four on the floor, ~116 bpm */
const music = { on: false, bus: null, next: 0, step: 0, timer: null };
const M16 = 60 / 116 / 4;
const BASS = [65.41, 55.0, 43.65, 49.0];
const CHORDS = [[261.6, 329.6, 392.0], [220.0, 261.6, 329.6], [174.6, 220.0, 261.6], [196.0, 246.9, 293.7]];
const TUNE = [[523.3, 0], [659.3, 3], [784.0, 6], [659.3, 10], [440.0, 16], [523.3, 19], [659.3, 22], [523.3, 26], [349.2, 32], [440.0, 35], [523.3, 38], [440.0, 42], [392.0, 48], [493.9, 51], [587.3, 54], [784.0, 58]];
function musicStart() {
  if (!ac || music.on) return;
  music.on = true;
  music.bus = ac.createGain();
  music.bus.gain.setValueAtTime(.0001, ac.currentTime);
  music.bus.gain.exponentialRampToValueAtTime(.42, ac.currentTime + .8);
  music.bus.connect(master);
  music.next = ac.currentTime + .08; music.step = 0;
  music.timer = setInterval(musicSchedule, 25);
}
function musicStop() {
  if (!music.on) return;
  music.on = false; clearInterval(music.timer);
  const bus = music.bus, now = ac.currentTime;
  bus.gain.cancelScheduledValues(now); bus.gain.setValueAtTime(bus.gain.value, now); bus.gain.setTargetAtTime(.0001, now, .18);
  setTimeout(() => bus.disconnect(), 1500);
}
function musicSchedule() {
  while (music.on && music.next < ac.currentTime + .15) { musicStep(music.step, music.next); music.next += M16; music.step = (music.step + 1) % 64; }
}
function musicStep(i, t) {
  const bus = music.bus, bar = Math.floor(i / 16), b = i % 16;
  if (i % 4 === 0) tone('sine', 140, t, .16, .8, 45, bus);                                   // kick
  if (i % 4 === 2) noise(t, .05, .22, 'highpass', 7000, 1, 0, bus);                          // open hat
  else if (i % 2 === 1) noise(t, .02, .08, 'highpass', 8000, 1, 0, bus);                     // tick
  if (b === 4 || b === 12) noise(t, .12, .3, 'bandpass', 1700, 1.2, 0, bus);                // clap
  if (i % 2 === 0) tone('sawtooth', BASS[bar] * (i % 4 === 2 ? 2 : 1), t, .13, .16, 0, bus); // octave bass
  if (b === 2 || b === 10) CHORDS[bar].forEach(f => tone('triangle', f, t, .14, .05, 0, bus)); // stabs
  TUNE.forEach(([f, at]) => { if (at === i) tone('triangle', f, t, .2, .07, 0, bus); });   // little tune
}

/* ------------------------------------------------------------------ */
/* hand-drawn path helpers                                             */
/* ------------------------------------------------------------------ */
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const J = a => (rnd() * 2 - 1) * a;
const F = v => Math.round(v * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const D = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rad = d => d * Math.PI / 180;

function mk(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const G = (parent, attrs) => mk('g', attrs || {}, parent);
function P(parent, d, w = 5, fill = 'none', attrs = {}) {
  const a = Object.assign({}, attrs);
  a.class = 'k' + (a.class ? ' ' + a.class : '');
  a.d = d; a['stroke-width'] = w; a.fill = fill;
  return mk('path', a, parent);
}
const FILL = (parent, d, fill, attrs = {}) => P(parent, d, 0, fill, Object.assign({}, attrs, { class: 'nos' + (attrs.class ? ' ' + attrs.class : '') }));

function cr(pts, closed = false) {
  const n = pts.length; if (n < 2) return '';
  const get = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  let d = `M${F(pts[0][0])} ${F(pts[0][1])}`;
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    d += ` C${F(p1[0] + (p2[0] - p0[0]) / 6)} ${F(p1[1] + (p2[1] - p0[1]) / 6)} ${F(p2[0] - (p3[0] - p1[0]) / 6)} ${F(p2[1] - (p3[1] - p1[1]) / 6)} ${F(p2[0])} ${F(p2[1])}`;
  }
  return closed ? d + 'Z' : d;
}
const jit = (pts, j) => pts.map(([x, y]) => [x + J(j), y + J(j)]);
const fr = (pts, j = 1.2, closed = false) => cr(jit(pts, j), closed);

function line(x1, y1, x2, y2, j = 1.4) {
  const len = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / len, uy = (y2 - y1) / len;
  const o1 = rnd() * Math.min(4, len * .05), o2 = rnd() * Math.min(4, len * .05);
  const ax = x1 - ux * o1 + J(j), ay = y1 - uy * o1 + J(j), bx = x2 + ux * o2 + J(j), by = y2 + uy * o2 + J(j);
  const b = J(Math.min(3.5, len * .02));
  return `M${F(ax)} ${F(ay)} Q${F((ax + bx) / 2 - uy * b)} ${F((ay + by) / 2 + ux * b)} ${F(bx)} ${F(by)}`;
}
const rect = (x, y, w, h, j = 1.4) => [line(x, y, x + w, y, j), line(x + w, y, x + w, y + h, j), line(x + w, y + h, x, y + h, j), line(x, y + h, x, y, j)].join(' ');
const rectC = (x, y, w, h, j = 1) => `M${F(x + J(j))} ${F(y + J(j))} L${F(x + w + J(j))} ${F(y + J(j))} L${F(x + w + J(j))} ${F(y + h + J(j))} L${F(x + J(j))} ${F(y + h + J(j))}Z`;
function box(parent, x, y, w, h, sw = 5, fill = '#fff') { FILL(parent, rectC(x, y, w, h, .6), fill); return P(parent, rect(x, y, w, h), sw); }
function ell(cx, cy, rx, ry, j = .04, sweep = .4, n = 12) {
  const a0 = rnd() * Math.PI * 2, pts = [], k = Math.round(n * (1 + sweep / (Math.PI * 2)));
  for (let i = 0; i <= k; i++) { const t = a0 + (i / n) * Math.PI * 2, r = 1 + J(j); pts.push([cx + Math.cos(t) * rx * r, cy + Math.sin(t) * ry * r]); }
  return cr(pts);
}
function ellC(cx, cy, rx, ry, j = .03, n = 12) {
  const a0 = rnd() * Math.PI * 2, pts = [];

  mk('rect', { width: 16, height: 16, fill: '#ffd23f' }, pat); mk('rect', { width: 8, height: 16, fill: '#141414' }, pat);
  const patBW = mk('pattern', { id: 'hazardBW', width: 16, height: 16, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);

  const L = $('L_reset');

  P(cap, `M${RX - 16} ${RY - 10} Q${RX - 10} ${RY - 20} ${RX} ${RY - 21}`, 3, 'none', { class: 'rz-shine' });

}
function startReset() {
  if (resetting) return;
  resetting = true;
  musicStop(); sfx.beep(); setTimeout(sfx.siren, 220);
  html.classList.add('resetting');
  const fade = $('resetFade');
  fade.classList.remove('back'); fade.setAttribute('opacity', 1);
  setTimeout(() => {
    resetBoard();
    fade.classList.add('back'); fade.setAttribute('opacity', 0);
    html.classList.remove('resetting');
    setTimeout(() => { sfx.chime(); resetting = false; }, 700);
  }, 1750);
}
function resetBoard() {
  // weather, light, power, lighting
  state.weather = null; for (const k in wbEls) wbEls[k].classList.remove('act');
  state.lightOn = true; swNub.setAttribute('transform', ''); clearTimeout(eyesTimer); hideDarkEyes();
  rope.socket = null; rope.held = false; rope.grab = -1; state.powerMode = 'none';
  rope.pts.forEach((p, i) => { p[0] = rope.init[i][0]; p[1] = rope.init[i][1]; rope.prev[i][0] = p[0]; rope.prev[i][1] = p[1]; });
  rope.inner.setAttribute('stroke', '#fff'); rope.awake = 60; renderRope();
  slider.lastTick = 0; slider.x = slider.x0; slider.thumb.setAttribute('transform', `translate(${slider.x0} 564)`); state.backgroundLighting = 0;
  // paint
  redPaint.on = false; redPaint.r = 0; redPaint.el.setAttribute('d', '');
  splats.forEach(sp => sp.el.remove()); splats.length = 0;
  // moving parts back to rest
  drawer.o = drawer.target = 0; drawer.held = false;
  flap.p = flap.target = 0; flap.held = false;
  curtain.fx = 183; curtain.revealed = false; renderCurtain();
  door.s = door.target = 1;
  balloon.r = 0; balloon.held = false; inflateStop();
  croc.angle = 0; croc.chomps = []; croc.bounce = 0; croc.held = false;
  wheel.angle = 0; wheel.vel = 0; wheel.held = false;
  lever.off = 0; lever.vel = 0; lever.held = false;
  gir.ext = 0; gir.vel = 0; gir.sw = -1; gir.tilt = 0;
  lb.x = 398; lb.y = 490; lb.heading = 0; renderLb();
  pgPose(false); pg.fig.classList.remove('phop', 'shake', 'shiver');
  // mirror fogs over, first face again
  mirror.groups.forEach(gr => gr.el.remove()); mirror.groups.length = 0; mirror.dirty = false; mirror.face = 0;
  mirror.faces.forEach((f, i) => f.setAttribute('opacity', i ? 0 : 1));
  for (const k in blobEls) blobEls[k].classList.remove('down');
  bits.length = 0;
  endCrash();
  for (const k in glowEls) glowEls[k].classList.remove('on');
  applyState(); seedWeather();
}

/* ------------------------------------------------------------------ */
/* sizing + loop                                                       */
/* ------------------------------------------------------------------ */
function resize() {
  const W = document.documentElement.clientWidth || window.innerWidth;
  const controlsHeight = document.getElementById('board-controls').getBoundingClientRect().height + 16;
  const H = Math.max(0,(document.documentElement.clientHeight || window.innerHeight)-controlsHeight), ar = VB.w / VB.h;
  if (!W || !H) return;
  stage.style.setProperty('--board-centre', H/2+'px');
  let w = W, h = W / ar; if (h > H) { h = H; w = H * ar; }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = cv.width / VB.w;
}
window.addEventListener('resize', resize);
const sizeObserver = new ResizeObserver(resize);
sizeObserver.observe(document.documentElement);
sizeObserver.observe(document.getElementById('board-controls'));
resize();
requestAnimationFrame(resize);

let lastT = performance.now(), T = 0;
function tick(now) {
  const dt = clamp((now - lastT) / 1000, 0, .05); lastT = Math.max(lastT, now); T += dt;
  updateRope(dt); updateCroc(dt); updateWheel(dt); updateLever(dt); updateDrawer(dt); updateFlap(dt); updateDoor(dt);
  updateBalloon(dt); updateRedPaint(dt); updateSplats(now); updateNeck(dt); updateProximity(dt, now); updateDisco(now, T); updateRainbow(T);
  updateFog(now, dt); updateCrash(dt); updatePasser(dt); updateDarkEyes(dt); drawFX(dt, T);
}
function frame(now) { if (!document.hidden && !movementPaused()) tick(now); else lastT = now; requestAnimationFrame(frame); }
// review aid: open with #test to step the board by hand from the console
if (location.hash === '#test') { window.__step = (n = 60) => { for (let i = 0; i < n; i++) tick(lastT + 1000 / 60); }; window.__spawn = spawnPasser; window.__mirror = mirror; }
// Portfolio adapter: native access to representative interactions, without rewriting the board.
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
let portfolioReduced = false, manualPause = null;
function movementPaused() { return manualPause === null ? motionPreference.matches || portfolioReduced : manualPause; }
function syncMovement() {
  const paused = movementPaused();
  html.dataset.boardPaused = String(paused || document.hidden);
  const button = document.getElementById('board-pause');
  button.textContent = paused ? 'Resume movement' : 'Pause movement';
  button.setAttribute('aria-pressed',String(paused));
  if (document.hidden) { musicStop(); ac?.suspend(); }
}
function syncAccessibleControls() {
  document.querySelectorAll('[data-weather-control]').forEach(button=>button.setAttribute('aria-pressed',String(state.weather===button.dataset.weatherControl)));
  document.getElementById('board-light').textContent = state.lightOn ? 'Turn lights off' : 'Turn lights on';
  document.getElementById('board-lighting').value = Math.round(state.backgroundLighting*100);
  document.getElementById('board-status').textContent = `Weather: ${state.weather || 'clear'}. Lights ${state.lightOn ? 'on' : 'off'}. Background lighting ${Math.round(state.backgroundLighting*100)} percent.`;
}
document.querySelectorAll('[data-weather-control]').forEach(button=>button.addEventListener('click',()=>{
  unlockAudio();setWeather(button.dataset.weatherControl);
  flashGlow(['wb-'+button.dataset.weatherControl,'penguin'],{sun:'#ffd23f',rain:'#5aa9ff',snow:'#8fd8ff'}[button.dataset.weatherControl]);
}));
document.getElementById('board-light').addEventListener('click',()=>{unlockAudio();setLight(!state.lightOn);flashGlow(['switch'],'#ffe14d');});
document.getElementById('board-lighting').addEventListener('input',event=>{unlockAudio();setSlider(slider.x0+(slider.x1-slider.x0)*Number(event.target.value)/100);flashGlow(['slider'],'#3fd0ff');});
document.getElementById('board-reset').addEventListener('click',resetBoard);
document.getElementById('board-pause').addEventListener('click',()=>{manualPause=!movementPaused();syncMovement();});
document.getElementById('board-mute').addEventListener('click',event=>{soundMuted=!soundMuted;if(master)master.gain.setValueAtTime(soundMuted?0:.5,ac.currentTime);event.currentTarget.setAttribute('aria-pressed',String(soundMuted));event.currentTarget.textContent=soundMuted?'Unmute sound':'Mute sound';});
document.getElementById('board-controls').addEventListener('toggle',resize);
document.addEventListener('keydown',event=>{const controls=document.getElementById('board-controls');if(event.key==='Escape'&&controls.open){event.preventDefault();event.stopImmediatePropagation();controls.open=false;controls.querySelector('summary').focus();}});
document.addEventListener('visibilitychange',syncMovement);
motionPreference.addEventListener('change',()=>{manualPause=null;syncMovement();});
window.busyBoardPortfolio=Object.freeze({setReducedMotion(value){portfolioReduced=Boolean(value);manualPause=null;syncMovement();}});
syncMovement();
applyState();
renderRope();
requestAnimationFrame(frame);
})();
